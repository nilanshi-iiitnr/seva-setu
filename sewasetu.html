<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEWA SETU+ — AI Road Safety &amp; Infrastructure Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#0A2540;
  --ink-soft:#4C6478;
  --ink-faint:#8398A8;
  --blue:#145DA0;
  --blue-deep:#0B3D66;
  --blue-bright:#2E7FD1;
  --teal:#0EA5A0;
  --teal-deep:#0B7F7A;
  --teal-tint:#E3F6F4;
  --blue-tint:#E9F1FA;
  --bg:#F2F6F8;
  --surface:#FFFFFF;
  --border:#DCE6EA;
  --border-soft:#EAF0F3;
  --danger:#D6473C;
  --danger-tint:#FCEAE8;
  --warning:#C97A16;
  --warning-tint:#FBF1E0;
  --success:#1F8F5F;
  --success-tint:#E4F6ED;
  --font: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --shadow-card: 0 1px 2px rgba(10,37,64,.04), 0 8px 24px -12px rgba(10,37,64,.14);
  --shadow-pop: 0 20px 45px -18px rgba(10,37,64,.35);
  color-scheme: light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ink:#EAF2F7; --ink-soft:#AFC2CF; --ink-faint:#7C8FA0;
    --bg:#0B1A26; --surface:#122436; --border:#1F3547; --border-soft:#1A2E3E;
    --blue-tint:#132C42; --teal-tint:#0F2E2C;
    --danger-tint:#3A1D1B; --warning-tint:#3A2C15; --success-tint:#123425;
  }
}
:root[data-theme="dark"]{
  --ink:#EAF2F7; --ink-soft:#AFC2CF; --ink-faint:#7C8FA0;
  --bg:#0B1A26; --surface:#122436; --border:#1F3547; --border-soft:#1A2E3E;
  --blue-tint:#132C42; --teal-tint:#0F2E2C;
  --danger-tint:#3A1D1B; --warning-tint:#3A2C15; --success-tint:#123425;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3,h4{font-family:var(--font); margin:0; color:var(--ink);}
p{margin:0;}
button{font-family:var(--font); cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

/* ============ SHELL ============ */
#root{min-height:100%;}
.topbar{
  position:sticky; top:0; z-index:50;
  padding:14px 24px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,var(--blue-deep),#0E4A7C);
  display:flex; align-items:center; gap:22px; color:#fff;
  box-shadow:0 6px 20px -10px rgba(0,0,0,.35);
  flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; margin-right:6px;}
.brand-mark{
  width:34px; height:34px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),#0EC9C0);
  display:flex; align-items:center; justify-content:center; font-weight:800; color:#04322F; font-size:15px;
}
.brand-text{line-height:1.15;}
.brand-text b{display:block; font-size:15px; font-weight:800; letter-spacing:.2px;}
.brand-text span{display:block; font-size:10.5px; color:#BFDCF2; font-weight:500;}
.product-switch{display:flex; gap:4px; background:rgba(255,255,255,.1); padding:4px; border-radius:12px;}
.product-switch button{
  border:none; background:transparent; color:#CFE3F5; padding:8px 14px; border-radius:9px;
  font-size:13px; font-weight:700; transition:.15s;
}
.product-switch button.active{background:#fff; color:var(--blue-deep); box-shadow:0 4px 10px rgba(0,0,0,.15);}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:12px; font-size:12.5px; color:#CFE3F5;}
.pulse-dot{width:7px; height:7px; border-radius:50%; background:#4EE7B1; display:inline-block; margin-right:6px; box-shadow:0 0 0 3px rgba(78,231,177,.25);}

.shell{display:flex; align-items:flex-start;}
.sidenav{
  width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  padding:18px 12px; position:sticky; top:64px; height:calc(100vh - 64px); overflow-y:auto;
}
.sidenav-label{font-size:10.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.4px; padding:8px 10px 6px;}
.sidenav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:transparent;
  padding:9px 10px; border-radius:10px; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:2px;
}
.sidenav button .dot{width:6px; height:6px; border-radius:50%; background:var(--border); flex-shrink:0;}
.sidenav button.active{background:var(--blue-tint); color:var(--blue-deep);}
.sidenav button.active .dot{background:var(--teal);}
.sidenav button:hover:not(.active){background:var(--bg);}

.stage{flex:1; min-width:0; padding:28px; display:flex; justify-content:center;}
.stage-inner{width:100%; max-width:1320px;}
.screen-tag{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;
}
.screen-tag h2{font-size:20px; font-weight:800;}
.screen-tag .meta{font-size:12px; color:var(--ink-faint); font-family:var(--mono);}

/* ============ PHONE FRAME ============ */
.phone-wrap{display:flex; justify-content:center;}
.phone{
  width:375px; background:#000; border-radius:44px; padding:12px; box-shadow:var(--shadow-pop);
}
.phone-screen{
  width:100%; height:760px; background:var(--surface); border-radius:34px; overflow-y:auto; position:relative;
  scrollbar-width:none;
}
.phone-screen::-webkit-scrollbar{display:none;}
.status-bar{
  display:flex; justify-content:space-between; align-items:center; padding:14px 22px 4px; font-size:12px; font-weight:700; color:var(--ink);
  position:sticky; top:0; background:var(--surface); z-index:5;
}
.phone-app-bar{padding:2px 20px 14px; display:flex; align-items:center; gap:10px;}
.phone-app-bar h3{font-size:17px; font-weight:800;}
.phone-body{padding:0 20px 28px;}

/* ============ COMPONENTS ============ */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:18px; box-shadow:var(--shadow-card);
}
.grid{display:grid; gap:16px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr);} }

.btn{
  border-radius:12px; padding:11px 18px; font-weight:700; font-size:13.5px; border:1px solid transparent; display:inline-flex; align-items:center; gap:8px;
}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff;}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--teal-deep)); color:#fff;}
.btn-ghost{background:var(--bg); color:var(--ink); border-color:var(--border);}
.btn-outline{background:transparent; color:var(--blue); border-color:var(--blue);}
.btn-block{width:100%; justify-content:center;}
.btn-sm{padding:7px 12px; font-size:12px; border-radius:9px;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:99px; font-size:11px; font-weight:700;}
.b-danger{background:var(--danger-tint); color:var(--danger);}
.b-warning{background:var(--warning-tint); color:var(--warning);}
.b-success{background:var(--success-tint); color:var(--success);}
.b-blue{background:var(--blue-tint); color:var(--blue-deep);}
.b-teal{background:var(--teal-tint); color:var(--teal-deep);}
.b-neutral{background:var(--bg); color:var(--ink-soft); border:1px solid var(--border);}

.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px 18px;}
.stat-tile .num{font-size:26px; font-weight:800; font-family:var(--mono); letter-spacing:-.5px;}
.stat-tile .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
.stat-tile .delta{font-size:11px; font-weight:700; margin-top:8px; display:inline-block;}

.progress{height:8px; border-radius:99px; background:var(--border-soft); overflow:hidden;}
.progress > div{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--teal),var(--blue));}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:none; color:var(--ink-faint); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--border);}
td{padding:11px 12px; border-bottom:1px solid var(--border-soft); color:var(--ink); font-weight:500;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

.timeline{position:relative; margin-left:6px; padding-left:26px;}
.timeline::before{content:'';position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--border);}
.tl-item{position:relative; padding-bottom:22px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute; left:-26px; top:2px; width:14px; height:14px; border-radius:50%; background:var(--surface); border:3px solid var(--border);}
.tl-item.done .tl-dot{border-color:var(--success); background:var(--success);}
.tl-item.active .tl-dot{border-color:var(--blue); background:var(--blue); box-shadow:0 0 0 4px var(--blue-tint);}
.tl-title{font-weight:700; font-size:13.5px;}
.tl-meta{font-size:11.5px; color:var(--ink-faint); margin-top:2px; font-family:var(--mono);}
.tl-desc{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}

.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.section-title{font-size:14px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
.muted{color:var(--ink-soft); font-size:12.5px;}
.hr{height:1px; background:var(--border-soft); margin:14px 0;}

.notif-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft);}
.notif-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px;}

.bottom-nav{
  position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border);
  display:flex; justify-content:space-around; padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));
}
.bottom-nav .bn-item{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9.5px; font-weight:700; color:var(--ink-faint);}
.bottom-nav .bn-item.on{color:var(--blue);}
.bn-icon{font-size:17px;}

/* map */
.map-canvas{position:relative; border-radius:var(--radius-m); overflow:hidden; background:linear-gradient(160deg,#DCEEF2,#EAF3EE); border:1px solid var(--border);}
.map-marker{position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; cursor:default;}
.map-pin{width:16px; height:16px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); box-shadow:0 2px 6px rgba(0,0,0,.25); border:2px solid #fff;}
.map-legend{position:absolute; bottom:14px; left:14px; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); border-radius:12px; padding:10px 14px; font-size:11.5px; box-shadow:var(--shadow-card); display:flex; gap:14px; flex-wrap:wrap;}
.legend-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}

.upload-box{border:2px dashed var(--border); border-radius:var(--radius-m); padding:30px 16px; text-align:center; background:var(--bg);}
.compare-slider{position:relative; border-radius:var(--radius-m); overflow:hidden; border:1px solid var(--border);}
.avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--teal)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;}

.kbd-focus:focus-visible{outline:3px solid var(--teal); outline-offset:2px;}
a{color:var(--blue);}

.sla-ring{width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:11px; flex-shrink:0;}
</style>
</head>
<body>
<div id="root">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S+</div>
      <div class="brand-text"><b>SEWA SETU+</b><span>Report once. Verify with AI. Track every repair.</span></div>
    </div>
    <div class="product-switch" id="productSwitch"></div>
    <div class="topbar-right"><span class="pulse-dot"></span>Live prototype · Chhattisgarh pilot data</div>
  </header>
  <div class="shell">
    <nav class="sidenav" id="sidenav"></nav>
    <main class="stage"><div class="stage-inner" id="stage"></div></main>
  </div>
</div>
<script>
/* ======================================================================
   DATA — realistic pilot dataset (Raipur / Chhattisgarh)
====================================================================== */
const rupee = n => '₹' + n.toLocaleString('en-IN');

const COMPLAINTS = [

  {id:'CG-RP-24921', type:'Broken Streetlight', icon:'💡', severity:'Medium', confidence:89, status:'Authority Assigned',
    road:'Amlidih Link Road', ward:'Zone 6 · Amlidih', authority:'Raipur Municipal Corporation (Electrical)',
    citizen:'Priya Nair', reported:'21 Sep 2026, 8:02 PM', sla:'1d 4h remaining', slaPct:40},

  {id:'CG-RP-24929', type:'Debris on Road', icon:'🪨', severity:'Low', confidence:84, status:'Submitted',

    citizen:'Meena Yadav', reported:'25 Sep 2026, 10:51 AM', sla:'2d 9h remaining', slaPct:12},
  {id:'CG-RP-24930', type:'Broken Divider', icon:'🚦', severity:'High', confidence:95, status:'Authority Assigned',
    road:'Pandri Bypass', ward:'Zone 7 · Pandri', authority:'PWD Raipur Division',
    citizen:'Dev Kumar Sinha', reported:'24 Sep 2026, 4:30 PM', sla:'22h remaining', slaPct:65},
  {id:'CG-RP-24902', type:'Pothole', icon:'🕳️', severity:'High', confidence:98, status:'Repair Verified',
    road:'Tatibandh Flyover Approach', ward:'Zone 4 · Tatibandh', authority:'PWD Raipur Division',
    citizen:'Ankita Verma', reported:'02 Sep 2026, 8:05 AM', sla:'Closed on time', slaPct:100},
  {id:'CG-RP-24887', type:'Waterlogging', icon:'💧', severity:'Critical', confidence:96, status:'Resolved',
    road:'Sarona Underbridge', ward:'Zone 1 · Sarona', authority:'Raipur Municipal Corporation',
    citizen:'Farhan Ali', reported:'28 Aug 2026, 6:22 AM', sla:'Closed on time', slaPct:100},
  {id:'CG-RP-24933', type:'Pothole', icon:'🕳️', severity:'Medium', confidence:90, status:'Submitted',
    road:'Mowa Link Road', ward:'Zone 8 · Mowa', authority:'PWD Raipur Division',
    citizen:'Kavita Joshi', reported:'26 Sep 2026, 7:12 PM', sla:'2d 22h remaining', slaPct:5},
  {id:'CG-RP-24905', type:'Broken Streetlight', icon:'💡', severity:'Low', confidence:88, status:'SLA Breached',
    road:'Gudhiyari Chowk', ward:'Zone 5 · Gudhiyari', authority:'Raipur Municipal Corporation (Electrical)',
    citizen:'Neha Chandrakar', reported:'10 Sep 2026, 5:45 PM', sla:'Overdue by 3d', slaPct:140},

const ROADS = [
  {name:'VIP Road — Telibandha to Tatibandh', ward:'Zone 4', score:88, complaints:14, accidents:3, hazards:'Potholes, faded markings', trend:'up'},
  {name:'Pandri Bypass', ward:'Zone 7', score:81, complaints:9, accidents:2, hazards:'Broken divider, poor lighting', trend:'up'},
  {name:'Sarona Underbridge', ward:'Zone 1', score:76, complaints:11, accidents:1, hazards:'Waterlogging in monsoon', trend:'down'},
  {name:'Shankar Nagar Main Road', ward:'Zone 2', score:69, complaints:8, accidents:1, hazards:'Waterlogging, drainage', trend:'flat'},
  {name:'Fafadih Chowk Junction', ward:'Zone 3', score:64, complaints:7, accidents:0, hazards:'Missing/damaged signage', trend:'down'},
  {name:'Gudhiyari Chowk', ward:'Zone 5', score:58, complaints:6, accidents:0, hazards:'Streetlight outages', trend:'flat'},
  {name:'Amlidih Link Road', ward:'Zone 6', score:47, complaints:4, accidents:0, hazards:'Streetlight outages', trend:'down'},
  {name:'Mowa Link Road', ward:'Zone 8', score:39, complaints:3, accidents:0, hazards:'Minor potholes', trend:'flat'},

const AUTHORITIES = [
  {name:'PWD Raipur Division', role:'State highways & arterial roads', pending:11, breached:2, compliance:84},
  {name:'Raipur Municipal Corporation', role:'Ward roads, drainage & civic works', pending:8, breached:1, compliance:79},
  {name:'RMC Electrical Wing', role:'Streetlights & signal infrastructure', pending:6, breached:1, compliance:88},
  {name:'Chhattisgarh Traffic Police', role:'Signage, dividers & signal safety', pending:4, breached:0, compliance:95},
];

const FUNDS = [
  {name:'VIP Road Pothole Rehabilitation', road:'VIP Road, Zone 4', target:850000, raised:612000, donors:214, type:'CSR + Community'},
  {name:'Sarona Underbridge Drainage Fix', road:'Sarona Underbridge, Zone 1', target:420000, raised:420000, donors:167, type:'CSR (L&T Foundation)'},
  {name:'Pandri Bypass Median Restoration', road:'Pandri Bypass, Zone 7', target:310000, raised:98000, donors:61, type:'Community'},
  {name:'Ward 5 Streetlight Revival', road:'Gudhiyari, Zone 5', target:180000, raised:143000, donors:88, type:'CSR (Power Grid CSR)'},
];

const NOTIFICATIONS = [
  {icon:'✅', tone:'success', title:'Repair verified by AI', body:'Your pothole report CG-RP-24902 on Tatibandh Flyover was confirmed fixed. Thanks for reporting!', time:'2h ago'},
  {icon:'⏱️', tone:'warning', title:'SLA countdown started', body:'PWD Raipur Division has 72h to repair the pothole you reported near Telibandha Chowk.', time:'1d ago'},
  {icon:'🏗️', tone:'blue', title:'Repair crew assigned', body:'A field crew has been assigned to Amlidih Link Road for the streetlight issue.', time:'2d ago'},
  {icon:'💰', tone:'teal', title:'Fund milestone reached', body:'Sarona Underbridge Drainage Fix hit 100% funding — repair scheduled next week.', time:'3d ago'},
  {icon:'⚠️', tone:'danger', title:'SLA breached — escalated', body:'Report CG-RP-24905 exceeded its repair window and has been escalated to the Zonal Commissioner.', time:'4d ago'},
];

const sevColor = s => ({Critical:'b-danger', High:'b-danger', Medium:'b-warning', Low:'b-blue'}[s] || 'b-neutral');
const statusColor = s => {
  if(s==='SLA Breached') return 'b-danger';
  if(s==='Resolved'||s==='Repair Verified') return 'b-success';
  if(s==='In Repair'||s==='Repair Uploaded') return 'b-teal';
  if(s==='Authority Assigned') return 'b-blue';
  return 'b-neutral';
};
const riskColor = s => s>=75 ? '#D6473C' : s>=50 ? '#C97A16' : '#1F8F5F';

/* ======================================================================
   SMALL COMPONENT HELPERS
====================================================================== */
const statTile = (num,lbl,delta,good=true) => `
  <div class="stat-tile">
    <div class="num">${num}</div>
    <div class="lbl">${lbl}</div>
    ${delta?`<div class="delta" style="color:${good?'var(--success)':'var(--danger)'}">${delta}</div>`:''}
  </div>`;

const sectionTitle = (t,right='') => `<div class="section-title"><span>${t}</span>${right}</div>`;

function mapCanvas(markers, legend, height=320){
  const pins = markers.map(m=>`
    <div class="map-marker" style="left:${m.x}%; top:${m.y}%;">
      <div class="map-pin" style="background:${m.color};"></div>
    </div>`).join('');
  const roads = `<svg width="100%" height="100%" style="position:absolute; inset:0;" preserveAspectRatio="none" viewBox="0 0 100 100">
      <path d="M5,70 Q30,55 50,58 T95,40" stroke="#C9DCE2" stroke-width="1.6" fill="none"/>
      <path d="M15,10 Q25,45 20,90" stroke="#C9DCE2" stroke-width="1.4" fill="none"/>
      <path d="M60,8 Q58,50 88,85" stroke="#C9DCE2" stroke-width="1.4" fill="none"/>
      <path d="M2,35 Q45,25 98,30" stroke="#C9DCE2" stroke-width="1.2" fill="none"/>
    </svg>`;
  const legendHtml = legend ? `<div class="map-legend">${legend.map(l=>`<span><span class="legend-dot" style="background:${l.color}"></span>${l.label}</span>`).join('')}</div>` : '';
  return `<div class="map-canvas" style="height:${height}px;">${roads}${pins}${legendHtml}</div>`;
}

function timelineHtml(steps){
  return `<div class="timeline">${steps.map(s=>`
    <div class="tl-item ${s.state}">

  ],
};
const RENDER = {citizen: citizenScreens, portal: portalScreens, gov: govScreens};
const LAST = {citizen:'home', portal:'portaldashboard', gov:'govoverview'};
let current = 'citizen';

function buildTopSwitch(){
  document.getElementById('productSwitch').innerHTML = PRODUCTS.map(p=>`
    <button data-p="${p.id}" class="${p.id===current?'active':''}" onclick="switchProduct('${p.id}')">${p.label}</button>`).join('');
}
function buildSidenav(){
  document.getElementById('sidenav').innerHTML = `<div class="sidenav-label">${PRODUCTS.find(p=>p.id===current).label} screens</div>` +
    SIDENAV[current].map(([k,l])=>`
      <button class="${k===LAST[current]?'active':''}" data-k="${k}" onclick="go('${current}','${k}')"><span class="dot"></span>${l}</button>`).join('');
}
function switchProduct(p){ current = p; buildTopSwitch(); buildSidenav(); renderScreen(); }
function go(p, k){ current = p; LAST[p] = k; buildTopSwitch(); buildSidenav(); renderScreen(); window.scrollTo(0,0); }

function renderScreen(){
  const k = LAST[current];
  const label = SIDENAV[current].find(x=>x[0]===k)[1];
  const html = RENDER[current][k]();
  document.getElementById('stage').innerHTML = `
    <div class="screen-tag"><h2>${PRODUCTS.find(p=>p.id===current).label} — ${label}</h2><span class="meta">${current}/${k}</span></div>
    ${html}`;
  requestAnimationFrame(initCharts);
}

/* ======================================================================
   CHARTS (drawn only if their canvas exists on the current screen)
====================================================================== */
function initCharts(){
  const palette = {blue:'#145DA0', teal:'#0EA5A0', danger:'#D6473C', warning:'#C97A16', success:'#1F8F5F', grid:'#DCE6EA'};
  const mk = (id, cfg) => { const el = document.getElementById(id); if(el && window.Chart) new Chart(el, cfg); };

  mk('chHazard', {type:'doughnut', data:{labels:['Pothole','Waterlogging','Streetlight','Signage','Debris','Divider'],
    datasets:[{data:[34,18,16,12,11,9], backgroundColor:['#145DA0','#0EA5A0','#C97A16','#2E7FD1','#8398A8','#D6473C'], borderWidth:2, borderColor:'#fff'}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:9, font:{size:10.5}}}}, cutout:'62%'}});

  mk('chTrend', {type:'line', data:{labels:['Wk1','Wk2','Wk3','Wk4','Wk5','Wk6'],
    datasets:[{data:[4.8,4.3,4.6,3.9,3.4,3.1], borderColor:palette.teal, backgroundColor:'rgba(14,165,160,.12)', fill:true, tension:.4, pointRadius:3}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{grid:{color:palette.grid}, ticks:{font:{size:10.5}}}, x:{grid:{display:false}, ticks:{font:{size:10.5}}}}}});

  mk('chSla', {type:'bar', data:{labels:AUTHORITIES.map(a=>a.name.replace('Raipur Municipal Corporation','RMC').replace(' Division','')),
    datasets:[{data:AUTHORITIES.map(a=>a.compliance), backgroundColor:AUTHORITIES.map(a=>a.compliance>=85?palette.success:a.compliance>=75?palette.warning:palette.danger), borderRadius:6}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{max:100, grid:{color:palette.grid}, ticks:{font:{size:10}}}, x:{grid:{display:false}, ticks:{font:{size:9.5}}}}}});

  mk('chGovTrend', {type:'line', data:{labels:Array.from({length:14},(_,i)=>'D'+(i+1)),
    datasets:[
      {label:'New', data:[22,25,19,28,31,26,24,29,33,27,25,30,28,32], borderColor:'#2E7FD1', backgroundColor:'transparent', tension:.4, pointRadius:0},
      {label:'Resolved', data:[18,20,17,22,24,23,21,25,27,24,22,26,25,28], borderColor:'#4EE7B1', backgroundColor:'transparent', tension:.4, pointRadius:0}
    ]},
    options:{plugins:{legend:{labels:{color:'#B7C9D6', font:{size:10.5}}}}, scales:{y:{grid:{color:'#1F3547'}, ticks:{color:'#8FA6B8', font:{size:10}}}, x:{grid:{display:false}, ticks:{color:'#8FA6B8', font:{size:9}}}}}});

  mk('chRoadRisk', {type:'bar', data:{labels:ROADS.map(r=>r.name.split('—')[0].split(',')[0].trim().slice(0,14)),
    datasets:[{data:ROADS.map(r=>r.score), backgroundColor:ROADS.map(r=>riskColor(r.score)), borderRadius:6}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{max:100, grid:{color:'#1F3547'}, ticks:{color:'#8FA6B8', font:{size:10}}}, y:{grid:{display:false}, ticks:{color:'#B7C9D6', font:{size:10}}}}}});

  mk('chAccVsComplaint', {type:'scatter', data:{datasets:[{label:'Roads', data:ROADS.map(r=>({x:r.complaints,y:r.accidents})),
    backgroundColor:'#2E7FD1', pointRadius:7}]},
    options:{plugins:{legend:{display:false}}, scales:{x:{title:{display:true, text:'Complaints (12mo)', color:'#8FA6B8'}, grid:{color:'#1F3547'}, ticks:{color:'#8FA6B8'}}, y:{title:{display:true, text:'Accidents', color:'#8FA6B8'}, grid:{color:'#1F3547'}, ticks:{color:'#8FA6B8'}}}}});
}

buildTopSwitch();
buildSidenav();
renderScreen();
</script>
</body>
</html>
